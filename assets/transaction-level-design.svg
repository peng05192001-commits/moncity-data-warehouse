<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1700" viewBox="0 0 2600 1700" role="img" aria-labelledby="title desc">
  <title id="title">MonCity Warehouse Version 2 — Level 0</title>
  <desc id="desc">Transaction-grain dimensional model with one fact row per source booking, maintenance record, or accident, retaining raw many-to-many bridges and removing derived grouping dimensions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .bg { fill: #f8fafc; }
      .band { stroke-width: 2.5; rx: 22; }
      .b1 { fill: #eff6ff; stroke: #93c5fd; }
      .b2 { fill: #f0fdfa; stroke: #5eead4; }
      .b3 { fill: #fff7ed; stroke: #fdba74; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .fact { fill: #fff; stroke: #334155; stroke-width: 3; rx: 14; filter: url(#shadow); }
      .ref { fill: #eef2ff; stroke: #818cf8; stroke-width: 2; rx: 12; }
      .h-dim { fill: #4f46e5; }
      .h-fact-blue { fill: #1d4ed8; }
      .h-fact-teal { fill: #0f766e; }
      .h-fact-orange { fill: #c2410c; }
      .h-bridge { fill: #a16207; }
      .name { fill: #fff; font: 700 22px 'Segoe UI', Arial, sans-serif; }
      .field { fill: #1e293b; font: 17px 'Segoe UI', Arial, sans-serif; }
      .key { fill: #0f172a; font: 700 16px 'Segoe UI', Arial, sans-serif; }
      .measure { fill: #9a3412; font: 700 17px 'Segoe UI', Arial, sans-serif; }
      .minor { fill: #64748b; font: 15px 'Segoe UI', Arial, sans-serif; }
      .divider { stroke: #e2e8f0; stroke-width: 1.3; }
      .line { fill: none; stroke: #475569; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .raw { fill: none; stroke: #a16207; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .cardinality { fill: #334155; font: 700 16px 'Segoe UI', Arial, sans-serif; paint-order: stroke; stroke: #f8fafc; stroke-width: 7; }
      .title { fill: #0f172a; font: 800 39px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: #475569; font: 21px 'Segoe UI', Arial, sans-serif; }
      .band-title { font: 800 22px 'Segoe UI', Arial, sans-serif; }
      .grain { fill: #334155; font: 18px 'Segoe UI', Arial, sans-serif; }
      .callout { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .callout-text { fill: #334155; font: 17px 'Segoe UI', Arial, sans-serif; }
      .removed { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; rx: 12; }
      .removed-text { fill: #991b1b; font: 16px 'Segoe UI', Arial, sans-serif; }
      .legend { fill: #334155; font: 16px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="2600" height="1700"/>
  <text class="title" x="60" y="58">MonCity Data Warehouse — Version 2 (Level 0 / No Aggregation)</text>
  <text class="subtitle" x="60" y="94">Each fact row preserves one operational transaction; raw dates and descriptive attributes remain available for query-time grouping</text>
  <g transform="translate(1915 30)">
    <rect x="0" y="0" width="625" height="78" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="18" y="16" width="24" height="18" rx="3" fill="#4f46e5"/><text class="legend" x="51" y="31">source-aligned dimension</text>
    <rect x="245" y="16" width="24" height="18" rx="3" fill="#1d4ed8"/><text class="legend" x="278" y="31">level-0 fact</text>
    <rect x="420" y="16" width="24" height="18" rx="3" fill="#a16207"/><text class="legend" x="453" y="31">raw bridge</text>
    <text class="legend" x="18" y="61"><tspan font-weight="700">DD</tspan><tspan dx="6">degenerate transaction ID</tspan><tspan dx="20" font-weight="700">1</tspan><tspan dx="6">constant row-count measure</tspan></text>
  </g>

  <rect class="band b1" x="30" y="125" width="2540" height="485"/>
  <text class="band-title" x="58" y="162" fill="#1d4ed8">BOOKING — TRANSACTION GRAIN</text>
  <text class="grain" x="450" y="162"><tspan font-weight="700">Grain:</tspan><tspan dx="6">one row per BOOKING record (BookingID)</tspan></text>

  <rect class="band b2" x="30" y="630" width="2540" height="480"/>
  <text class="band-title" x="58" y="667" fill="#0f766e">MAINTENANCE — TRANSACTION GRAIN</text>
  <text class="grain" x="525" y="667"><tspan font-weight="700">Grain:</tspan><tspan dx="6">one row per MAINTENANCE record (MaintenanceID)</tspan></text>

  <rect class="band b3" x="30" y="1130" width="2540" height="475"/>
  <text class="band-title" x="58" y="1167" fill="#c2410c">ACCIDENT — TRANSACTION GRAIN</text>
  <text class="grain" x="465" y="1167"><tspan font-weight="700">Grain:</tspan><tspan dx="6">one row per ACCIDENTINFO record (AccidentID); involved cars remain in CARACCIDENT</tspan></text>

  <!-- BOOKING CONNECTORS -->
  <path class="line" d="M430 260 H650 V310 H750"/>
  <path class="line" d="M430 475 H650 V440 H750"/>
  <path class="line" d="M1290 375 H1460"/>
  <text class="cardinality" x="440" y="248">1</text><text class="cardinality" x="718" y="298">M</text>
  <text class="cardinality" x="440" y="463">1</text><text class="cardinality" x="718" y="428">M</text>
  <text class="cardinality" x="1300" y="363">M</text><text class="cardinality" x="1436" y="363">1</text>

  <g transform="translate(70 190)">
    <rect class="card" width="360" height="190"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H346Q360 0 360 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_PASSENGER_L0</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">PassengerKey</text>
    <line class="divider" x1="14" y1="91" x2="346" y2="91"/>
    <text class="field" x="55" y="118">PassengerID · PassengerName</text>
    <text class="field" x="55" y="145">PassengerRole · PassengerGender</text>
    <text class="field" x="55" y="172">PassengerAge (raw numeric age)</text>
  </g>
  <g transform="translate(70 405)">
    <rect class="card" width="360" height="170"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H346Q360 0 360 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_FACULTY_L0</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">FacultyKey</text>
    <line class="divider" x1="14" y1="91" x2="346" y2="91"/>
    <text class="field" x="55" y="120">FacultyID · FacultyName</text>
    <text class="field" x="55" y="148">FacultyZone</text>
  </g>
  <g transform="translate(750 200)">
    <rect class="fact" width="540" height="350"/>
    <path class="h-fact-blue" d="M0 14Q0 0 14 0H526Q540 0 540 14V52H0Z"/>
    <text class="name" x="18" y="35">FACT_BOOKING_L0</text>
    <text class="key" x="18" y="84">DD</text><text class="field" x="62" y="84">BookingID</text>
    <text class="field" x="62" y="116">BookingDate</text>
    <text class="field" x="62" y="148">DepartureZone · DestinationZone</text>
    <text class="key" x="18" y="180">FK</text><text class="field" x="62" y="180">PassengerKey</text>
    <text class="key" x="18" y="212">FK</text><text class="field" x="62" y="212">FacultyKey</text>
    <text class="key" x="18" y="244">FK</text><text class="field" x="62" y="244">CarKey</text>
    <line class="divider" x1="16" y1="266" x2="524" y2="266"/>
    <text class="measure" x="18" y="302">BookingRecordCount = 1</text>
    <text class="minor" x="18" y="332">Month and age group are derived at query time</text>
  </g>
  <g transform="translate(1460 205)">
    <rect class="card" width="430" height="270"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H416Q430 0 430 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_CAR_L0</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">CarKey</text>
    <line class="divider" x1="14" y1="91" x2="416" y2="91"/>
    <text class="field" x="55" y="120">RegistrationNo</text>
    <text class="field" x="55" y="148">CarModel</text>
    <text class="field" x="55" y="176">ManufacturingYear</text>
    <text class="field" x="55" y="204">CarBodyType</text>
    <text class="field" x="55" y="232">NumSeats</text>
    <text class="minor" x="18" y="258">Conformed dimension reused by all facts</text>
  </g>
  <g transform="translate(1960 195)">
    <rect class="removed" width="560" height="285"/>
    <text class="removed-text" x="22" y="35"><tspan font-weight="700">Derived/group dimensions removed in Level 0</tspan></text>
    <text class="removed-text" x="22" y="74">• DIM_MONTH → retain raw BookingDate</text>
    <text class="removed-text" x="22" y="108">• DIM_AGE_GROUP → retain raw PassengerAge</text>
    <text class="removed-text" x="22" y="142">• DIM_CAR_BODY → use source-aligned DIM_CAR_L0</text>
    <text class="removed-text" x="22" y="176">• DIM_ACCIDENT_ZONE / DIM_SEVERITY → raw fact attributes</text>
    <text class="removed-text" x="22" y="210">• DIM_CENTRE_GROUP / DIM_CAR_GROUP → raw bridge rows</text>
    <text class="removed-text" x="22" y="254">No pre-aggregation; CASE / EXTRACT can group at query time.</text>
  </g>

  <!-- MAINTENANCE CONNECTORS -->
  <path class="line" d="M430 760 H660 V785 H730"/>
  <path class="line" d="M430 980 H660 V935 H730"/>
  <path class="line" d="M1270 840 H1380"/>
  <path class="raw" d="M1740 785 H1780"/>
  <path class="raw" d="M2100 785 H2140"/>
  <text class="cardinality" x="440" y="748">1</text><text class="cardinality" x="696" y="773">M</text>
  <text class="cardinality" x="440" y="968">1</text><text class="cardinality" x="696" y="923">M</text>
  <text class="cardinality" x="1280" y="828">M</text><text class="cardinality" x="1355" y="828">1</text>
  <text class="cardinality" x="1750" y="773">1</text><text class="cardinality" x="1757" y="773">M</text>
  <text class="cardinality" x="2110" y="773">M</text><text class="cardinality" x="2117" y="773">1</text>

  <g transform="translate(70 700)">
    <rect class="card" width="360" height="180"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H346Q360 0 360 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_MAINT_TYPE_L0</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">MaintenanceTypeKey</text>
    <line class="divider" x1="14" y1="91" x2="346" y2="91"/>
    <text class="field" x="55" y="121">MaintenanceType</text>
    <text class="field" x="55" y="150">MaintenanceDescription</text>
  </g>
  <g transform="translate(70 900)">
    <rect class="card" width="360" height="170"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H346Q360 0 360 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_TEAM_L0</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">TeamKey</text>
    <line class="divider" x1="14" y1="91" x2="346" y2="91"/>
    <text class="field" x="55" y="121">TeamID · TeamLeader</text>
    <text class="field" x="55" y="149">Phone</text>
  </g>
  <g transform="translate(730 700)">
    <rect class="fact" width="540" height="330"/>
    <path class="h-fact-teal" d="M0 14Q0 0 14 0H526Q540 0 540 14V52H0Z"/>
    <text class="name" x="18" y="35">FACT_MAINTENANCE_L0</text>
    <text class="key" x="18" y="84">DD</text><text class="field" x="62" y="84">MaintenanceID</text>
    <text class="field" x="62" y="116">MaintenanceDate</text>
    <text class="key" x="18" y="148">FK</text><text class="field" x="62" y="148">CarKey</text>
    <text class="key" x="18" y="180">FK</text><text class="field" x="62" y="180">MaintenanceTypeKey</text>
    <text class="key" x="18" y="212">FK</text><text class="field" x="62" y="212">TeamKey</text>
    <line class="divider" x1="16" y1="234" x2="524" y2="234"/>
    <text class="measure" x="18" y="270">MaintenanceCost</text>
    <text class="measure" x="18" y="302">MaintenanceRecordCount = 1</text>
  </g>
  <g transform="translate(1380 700)">
    <rect class="ref" width="360" height="170"/>
    <text class="key" x="20" y="42">DIM_TEAM_L0</text>
    <text class="field" x="20" y="78">TeamKey · TeamID</text>
    <text class="minor" x="20" y="114">same table shown at left</text>
    <text class="minor" x="20" y="140">feeds raw BELONGTO bridge</text>
  </g>
  <g transform="translate(1780 700)">
    <rect class="card" width="320" height="170"/>
    <path class="h-bridge" d="M0 14Q0 0 14 0H306Q320 0 320 14V46H0Z"/>
    <text class="name" x="16" y="31">BRIDGE_BELONGTO_L0</text>
    <text class="key" x="16" y="82">PK, FK</text><text class="field" x="102" y="82">TeamKey</text>
    <line class="divider" x1="14" y1="99" x2="306" y2="99"/>
    <text class="key" x="16" y="132">PK, FK</text><text class="field" x="102" y="132">CentreKey</text>
  </g>
  <g transform="translate(2140 685)">
    <rect class="card" width="380" height="205"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H366Q380 0 380 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_RESEARCH_CENTRE_L0</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">CentreKey</text>
    <line class="divider" x1="14" y1="91" x2="366" y2="91"/>
    <text class="field" x="55" y="120">CentreID · CentreName</text>
    <text class="field" x="55" y="148">Phone · OpeningHour</text>
    <text class="minor" x="20" y="181">Raw TEAM ↔ CENTRE M:N retained</text>
  </g>
  <g transform="translate(1380 930)">
    <rect class="ref" width="1140" height="120"/>
    <text class="key" x="20" y="36">DIM_CAR_L0 (shared physical dimension)</text>
    <text class="field" x="20" y="70">FACT_MAINTENANCE_L0.CarKey → the same DIM_CAR_L0 shown in the booking band.</text>
    <text class="minor" x="20" y="98">No centre membership group or WeightFactor is needed at Level 0; source BELONGTO rows preserve membership.</text>
  </g>
  <path class="line" d="M1270 965 H1380"/>
  <text class="cardinality" x="1280" y="953">M</text><text class="cardinality" x="1355" y="953">1</text>

  <!-- ACCIDENT CONNECTORS -->
  <path class="line" d="M430 1275 H650 V1320 H740"/>
  <path class="raw" d="M1280 1370 H1480"/>
  <path class="raw" d="M1840 1370 H1960"/>
  <text class="cardinality" x="440" y="1263">1</text><text class="cardinality" x="708" y="1308">M</text>
  <text class="cardinality" x="1290" y="1358">1</text><text class="cardinality" x="1453" y="1358">M</text>
  <text class="cardinality" x="1850" y="1358">M</text><text class="cardinality" x="1935" y="1358">1</text>

  <g transform="translate(70 1205)">
    <rect class="card" width="360" height="175"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H346Q360 0 360 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_ERROR_L0</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">ErrorKey</text>
    <line class="divider" x1="14" y1="91" x2="346" y2="91"/>
    <text class="field" x="55" y="121">ErrorCode</text>
    <text class="field" x="55" y="150">ErrorMessage</text>
  </g>
  <g transform="translate(740 1200)">
    <rect class="fact" width="540" height="340"/>
    <path class="h-fact-orange" d="M0 14Q0 0 14 0H526Q540 0 540 14V52H0Z"/>
    <text class="name" x="18" y="35">FACT_ACCIDENT_L0</text>
    <text class="key" x="18" y="84">DD</text><text class="field" x="62" y="84">AccidentID</text>
    <text class="field" x="62" y="122">AccidentZone (raw source value)</text>
    <text class="field" x="62" y="158">CarDamageSeverity (raw source value)</text>
    <text class="key" x="18" y="194">FK</text><text class="field" x="62" y="194">ErrorKey</text>
    <line class="divider" x1="16" y1="220" x2="524" y2="220"/>
    <text class="measure" x="18" y="258">AccidentRecordCount = 1</text>
    <text class="minor" x="18" y="294">Cars connect through BRIDGE_CARACCIDENT_L0</text>
    <text class="minor" x="18" y="320">No accident date is available in the source</text>
  </g>
  <g transform="translate(1480 1285)">
    <rect class="card" width="360" height="170"/>
    <path class="h-bridge" d="M0 14Q0 0 14 0H346Q360 0 360 14V46H0Z"/>
    <text class="name" x="16" y="31">BRIDGE_CARACCIDENT_L0</text>
    <text class="key" x="16" y="82">PK, FK</text><text class="field" x="102" y="82">AccidentID</text>
    <line class="divider" x1="14" y1="99" x2="346" y2="99"/>
    <text class="key" x="16" y="132">PK, FK</text><text class="field" x="102" y="132">CarKey</text>
  </g>
  <g transform="translate(1960 1270)">
    <rect class="ref" width="560" height="205"/>
    <text class="key" x="20" y="42">DIM_CAR_L0 (shared physical dimension)</text>
    <text class="field" x="20" y="82">CarKey · RegistrationNo · CarModel</text>
    <text class="field" x="20" y="116">ManufacturingYear · CarBodyType · NumSeats</text>
    <text class="minor" x="20" y="154">Raw ACCIDENT ↔ CAR M:N is retained without</text>
    <text class="minor" x="20" y="180">creating CarGroupKey, GroupList, or WeightFactor.</text>
  </g>
  <g transform="translate(70 1455)">
    <rect class="callout" width="620" height="115"/>
    <text class="callout-text" x="20" y="34"><tspan font-weight="700" fill="#9a3412">Source limitation:</tspan><tspan dx="6">no accident date/time.</tspan></text>
    <text class="callout-text" x="20" y="69">Therefore Level 0 cannot support truthful accident-by-month</text>
    <text class="callout-text" x="20" y="96">analysis unless a new authoritative date source is supplied.</text>
  </g>

  <g transform="translate(740 1575)">
    <rect class="callout" width="1780" height="75"/>
    <text class="callout-text" x="20" y="31"><tspan font-weight="700">Repeated DIM_CAR_L0 references denote one conformed physical table.</tspan><tspan dx="6">Level 0 preserves detail; it does not precompute Month, Age Group, Centre Group, or Car Group keys.</tspan></text>
    <text class="callout-text" x="20" y="58">Measures remain additive because every transaction row carries a constant record count of 1.</text>
  </g>

  <text class="subtitle" x="2520" y="1680" text-anchor="end">Figure 3 · Version 2 dimensional model</text>
</svg>
