    <text class="key" x="16" y="132">PK, FK</text><text class="field" x="104" y="132">CentreKey</text>
  </g>
  <g transform="translate(2150 740)">
    <rect class="card" width="370" height="220"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H356Q370 0 370 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_RESEARCH_CENTRE</text>
    <text class="key" x="16" y="78">PK</text><text class="field" x="55" y="78">CentreKey</text>
    <line class="divider" x1="14" y1="94" x2="356" y2="94"/>
