    <path class="h-dim" d="M0 14Q0 0 14 0H376Q390 0 390 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_CAR_BODY</text>
    <text class="key" x="16" y="76">PK</text><text class="field" x="55" y="76">CarBodyKey</text>
    <line class="divider" x1="14" y1="92" x2="376" y2="92"/>
    <text class="field" x="55" y="124">CarBodyType</text>
    <text class="field" x="55" y="154">NumSeats</text>
  </g>
  <g transform="translate(900 260)">
