    <path class="h-fact-blue" d="M0 14Q0 0 14 0H486Q500 0 500 14V52H0Z"/>
    <text class="name" x="18" y="35">FACT_BOOKING_AGG</text>
    <text class="key" x="18" y="84">FK</text><text class="field" x="62" y="84">MonthKey</text>
    <text class="key" x="18" y="116">FK</text><text class="field" x="62" y="116">FacultyKey</text>
    <text class="key" x="18" y="148">FK</text><text class="field" x="62" y="148">AgeGroupKey</text>
    <text class="key" x="18" y="180">FK</text><text class="field" x="62" y="180">CarBodyKey</text>
    <line class="divider" x1="16" y1="202" x2="484" y2="202"/>
    <text class="measure" x="18" y="238">Σ BookingRecordCount</text>
    <text class="minor" x="18" y="273">Source BOOKING rows aggregated by all four keys</text>
  </g>
  <g transform="translate(2070 225)">
    <rect class="callout" width="450" height="150" stroke="#93c5fd"/>
    <text class="callout-text" x="20" y="34"><tspan font-weight="700">Age rules</tspan></text>
    <text class="callout-text" x="20" y="66">Young adults: 18–35</text>
    <text class="callout-text" x="20" y="96">Middle-aged adults: 36–59</text>
    <text class="callout-text" x="20" y="126">Old-aged adults: 60 and over</text>
  </g>

