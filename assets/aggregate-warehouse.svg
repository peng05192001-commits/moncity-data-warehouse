  <g transform="translate(1320 1010)">
    <rect class="callout" width="1200" height="110" stroke="#5eead4"/>
    <text class="callout-text" x="20" y="34"><tspan font-weight="700">Bridge rule:</tspan><tspan dx="6">filter a named centre (for example CE04) through the bridge and sum the unweighted maintenance count once per fact group.</tspan></text>
    <text class="callout-text" x="20" y="72">Use WeightFactor only when allocating totals across every centre member; this prevents double counting in all-centre roll-ups.</text>
  </g>

