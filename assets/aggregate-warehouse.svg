  <text class="cardinality" x="2110" y="843">M</text><text class="cardinality" x="2124" y="843">1</text>

  <g transform="translate(80 735)">
    <rect class="card" width="420" height="150"/>
    <path class="h-dim" d="M0 14Q0 0 14 0H406Q420 0 420 14V46H0Z"/>
    <text class="name" x="16" y="31">DIM_CAR_BODY</text>
