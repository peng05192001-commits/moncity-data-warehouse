<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1800" viewBox="0 0 2600 1800" role="img" aria-labelledby="title desc">
  <title id="title">MonCity Warehouse Version 1 — Highest Aggregation</title>
  <desc id="desc">Three aggregated fact tables for booking, maintenance, and accident analysis, including research-centre and car multi-value bridge structures.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .bg { fill: #f8fafc; }
      .band-blue { fill: #eff6ff; stroke: #93c5fd; }
      .band-teal { fill: #f0fdfa; stroke: #5eead4; }
      .band-orange { fill: #fff7ed; stroke: #fdba74; }
      .band { stroke-width: 2.5; rx: 22; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .fact { fill: #fff; stroke: #334155; stroke-width: 3; rx: 14; filter: url(#shadow); }
      .h-dim { fill: #4f46e5; }
      .h-fact-blue { fill: #1d4ed8; }
      .h-fact-teal { fill: #0f766e; }
      .h-fact-orange { fill: #c2410c; }
      .h-group { fill: #7c3aed; }
      .h-bridge { fill: #a16207; }
      .name { fill: white; font: 700 23px 'Segoe UI', Arial, sans-serif; }
      .field { fill: #1e293b; font: 18px 'Segoe UI', Arial, sans-serif; }
      .key { fill: #0f172a; font: 700 17px 'Segoe UI', Arial, sans-serif; }
      .measure { fill: #9a3412; font: 700 18px 'Segoe UI', Arial, sans-serif; }
      .minor { fill: #64748b; font: 16px 'Segoe UI', Arial, sans-serif; }
      .divider { stroke: #e2e8f0; stroke-width: 1.3; }
      .line { fill: none; stroke: #475569; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .multi { fill: none; stroke: #7c3aed; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .cardinality { fill: #334155; font: 700 17px 'Segoe UI', Arial, sans-serif; paint-order: stroke; stroke: #f8fafc; stroke-width: 7; }
      .title { fill: #0f172a; font: 800 39px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: #475569; font: 21px 'Segoe UI', Arial, sans-serif; }
      .band-title { font: 800 23px 'Segoe UI', Arial, sans-serif; }
      .grain { fill: #334155; font: 18px 'Segoe UI', Arial, sans-serif; }
      .grain-strong { font-weight: 700; }
      .callout { fill: #ffffff; stroke-width: 2; rx: 12; }
      .callout-text { fill: #334155; font: 17px 'Segoe UI', Arial, sans-serif; }
      .legend { fill: #334155; font: 17px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="2600" height="1800"/>
  <text class="title" x="60" y="60">MonCity Data Warehouse — Version 1 (Highest Aggregation)</text>
  <text class="subtitle" x="60" y="96">Three subject-area facts; one fact row per complete dimensional combination</text>
  <g transform="translate(1810 34)">
    <rect x="0" y="0" width="730" height="78" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="18" y="16" width="24" height="18" rx="3" fill="#4f46e5"/><text class="legend" x="51" y="31">dimension</text>
    <rect x="160" y="16" width="24" height="18" rx="3" fill="#1d4ed8"/><text class="legend" x="193" y="31">fact</text>
    <rect x="275" y="16" width="24" height="18" rx="3" fill="#7c3aed"/><text class="legend" x="308" y="31">group dimension</text>
    <rect x="500" y="16" width="24" height="18" rx="3" fill="#a16207"/><text class="legend" x="533" y="31">bridge</text>
    <text class="legend" x="18" y="62"><tspan font-weight="700">FK</tspan><tspan dx="6">foreign key</tspan><tspan dx="22" font-weight="700">Σ</tspan><tspan dx="6">additive measure</tspan><tspan dx="22">1 : M relationships shown on connectors</tspan></text>
  </g>

  <!-- DOMAIN BANDS -->
  <rect class="band band-blue" x="30" y="130" width="2540" height="510"/>
  <text class="band-title" x="58" y="167" fill="#1d4ed8">BOOKING AGGREGATE</text>
  <text class="grain" x="320" y="167"><tspan class="grain-strong">Grain:</tspan><tspan dx="6">one row per Month × Faculty × Passenger Age Group × Car Body Type / Seat Count</tspan></text>

  <rect class="band band-teal" x="30" y="660" width="2540" height="500"/>
  <text class="band-title" x="58" y="697" fill="#0f766e">MAINTENANCE AGGREGATE</text>
  <text class="grain" x="420" y="697"><tspan class="grain-strong">Grain:</tspan><tspan dx="6">one row per Car Body Type / Seat Count × Maintenance Type × Research-Centre Membership Group</tspan></text>

  <rect class="band band-orange" x="30" y="1180" width="2540" height="535"/>
  <text class="band-title" x="58" y="1217" fill="#c2410c">ACCIDENT AGGREGATE</text>
  <text class="grain" x="355" y="1217"><tspan class="grain-strong">Grain:</tspan><tspan dx="6">one row per Involved-Car Group × Accident Zone × Error Code × Damage Severity</tspan></text>

  <!-- BOOKING CONNECTORS -->
  <path class="line" d="M420 295 H740 V360 H900"/>
  <path class="line" d="M420 515 H740 V460 H900"/>
  <path class="line" d="M1620 295 H1460 V360 H1400"/>
  <path class="line" d="M1620 515 H1460 V460 H1400"/>
  <text class="cardinality" x="430" y="283">1</text><text class="cardinality" x="867" y="349">M</text>
  <text class="cardinality" x="430" y="503">1</text><text class="cardinality" x="867" y="449">M</text>
  <text class="cardinality" x="1592" y="283">1</text><text class="cardinality" x="1428" y="349">M</text>
  <text class="cardinality" x="1592" y="503">1</text><text class="cardinality" x="1428" y="449">M</text>

